<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plošňák</title>
  <meta name="description" content="Plošňák: logická hra. Poskládej z bloků program a panáček ho na desce plošných spojů vykoná. Doslova." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="../favicon.ico" />
  <style>
    :root {
      --bg: #f7f8fa; --paper: #fff; --text: #101317; --muted: #5f6872; --soft: #d8dde3;
      --hard: #101317; --accent: #006c86; --y: #f2b705; --red: #d9483b;
      --pohyb: #d3ebf1; --ruce: #fde4a0; --rizeni: #e6dcf6; --rozhod: #fbd6c4; --kapsa: #ecd9bd; --pajka: #d5dde2; --signal: #d7f0c9;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
      background:
        linear-gradient(to right, rgba(16,19,23,.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(16,19,23,.045) 1px, transparent 1px), var(--bg);
      background-size: 48px 48px;
    }
    button { font: inherit; color: inherit; }

    .hlavicka {
      width: min(1180px, calc(100% - 24px)); margin: 0 auto; padding: 14px 0 10px;
      display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--hard);
    }
    .znacka {
      width: 32px; height: 32px; display: grid; place-items: center; flex: none;
      background: var(--hard); color: #fff; font: 900 12px/1 var(--mono); text-decoration: none;
    }
    .titul { font-weight: 900; letter-spacing: -.03em; font-size: 20px; }
    .verze {
      margin-left: auto; padding: 3px 7px; border: 1px solid var(--hard); background: var(--bg);
      font: 700 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
    }

    .hra {
      width: min(1180px, calc(100% - 24px)); margin: 12px auto 32px;
      display: grid; gap: 12px;
      grid-template-columns: minmax(0, 1fr) 126px;
      grid-template-areas: "zadani zadani" "deska deska" "ovladani ovladani" "program paleta";
      align-items: start;
    }
    .zadani { grid-area: zadani; }
    .deska { grid-area: deska; position: relative; }
    .ovladani { grid-area: ovladani; }
    #panel-program { grid-area: program; }
    .panel-paleta { grid-area: paleta; }
    @media (min-width: 960px) {
      .hra {
        grid-template-columns: minmax(0, 1fr) 290px 190px;
        grid-template-areas: "zadani program paleta" "deska program paleta" "ovladani program paleta";
        grid-template-rows: auto auto 1fr; margin-top: 20px; gap: 16px 20px;
      }
      .panel-paleta { position: sticky; top: 16px; }
    }

    .levely { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .levely::-webkit-scrollbar { display: none; }
    .levely .tl { flex: none; }
    .levely .predel { flex: none; width: 1px; margin: 0 4px; background: var(--hard); }
    .levely .tl { min-height: 30px; min-width: 42px; padding: 0 8px; font-size: 11px; box-shadow: none; }
    .levely .tl.hotovo { background: #d6eadf; }
    .levely .tl.hotovo::after { content: " ✓"; }
    .levely .tl[aria-current] { background: var(--hard); color: #fff; }
    .stitek { font: 800 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
    .zadani h1 { margin: 6px 0 4px; font-size: clamp(22px, 4vw, 30px); line-height: 1.1; letter-spacing: -.03em; }
    .zadani p { margin: 0; }
    .napoveda { color: var(--muted); font-size: 14px; margin-top: 4px !important; }
    .cile { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .cile[hidden] { display: none; }
    .cip { padding: 3px 8px; border: 1px solid var(--hard); background: var(--paper); font: 700 11px/1.3 var(--mono); }
    .cip.nej { background: var(--y); }

    .deska canvas { display: block; margin: 0 auto; touch-action: manipulation; }

    .ovladani { display: grid; gap: 8px; }
    .tlacitka { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .tl {
      min-height: 40px; padding: 0 12px; border: 1px solid var(--hard); background: var(--paper);
      font: 800 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
      box-shadow: 2px 2px 0 rgba(16,19,23,.18); -webkit-tap-highlight-color: transparent;
    }
    .tl:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 rgba(16,19,23,.18); }
    .tl:disabled { opacity: .4; cursor: default; transform: none; }
    .tl.hlavni { background: var(--hard); color: #fff; }
    .tl[aria-pressed="true"] { background: var(--y); }
    .tl:focus-visible, .blok:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #spust { min-width: 96px; }
    .skupina { display: inline-flex; margin-left: auto; }
    .skupina .tl { box-shadow: none; padding: 0 10px; }
    .skupina .tl + .tl { border-left: 0; }
    #testy { display: inline-flex; gap: 4px; align-items: center; font: 700 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; }
    #testy[hidden] { display: none; }
    #testy .tl { min-height: 32px; min-width: 32px; padding: 0 8px; box-shadow: none; }
    .stav { min-height: 20px; font: 600 13px/1.4 var(--mono); color: var(--muted); }
    .stav.chyba { color: var(--red); }
    .stav.ok { color: #0b7a4f; }

    .panel { border: 1px solid var(--hard); background: var(--paper); box-shadow: 3px 3px 0 rgba(16,19,23,.12); }
    .panel-hlava {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--hard);
      font: 800 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
    }
    .zalozky { display: flex; border-bottom: 1px solid var(--hard); }
    .zalozky[hidden] { display: none; }
    .zal { flex: 1; min-height: 36px; border: 0; border-right: 1px solid var(--hard); background: var(--bg); font: 800 12px/1 var(--mono); text-transform: uppercase; letter-spacing: .05em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .zal:last-child { border-right: 0; }
    .zal[aria-pressed="true"] { background: var(--paper); box-shadow: inset 0 -3px 0 var(--hard); }
    .zal i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--hard); display: inline-block; }
    #pocet { margin-left: auto; color: var(--muted); letter-spacing: .02em; text-transform: none; }
    #pocet.pres { color: var(--red); }
    #vymaz { min-height: 26px; padding: 0 7px; font-size: 10px; box-shadow: none; }

    ol#program { list-style: none; margin: 0; padding: 8px; display: grid; gap: 5px; min-height: 120px; }
    @media (min-width: 960px) { ol#program { max-height: calc(100vh - 150px); overflow-y: auto; } }
    #paleta { padding: 8px; display: grid; gap: 6px; }
    .prazdny { padding: 18px 8px; text-align: center; color: var(--muted); font-size: 13px; border: 1px dashed var(--soft); }
    .prazdny[hidden] { display: none; }

    .blok {
      position: relative; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 42px;
      padding: 0 10px; border: 1.5px solid var(--hard); background: var(--pohyb);
      font: 700 15px/1.1 Inter, ui-sans-serif, system-ui, sans-serif; text-align: left;
      cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      touch-action: none; -webkit-tap-highlight-color: transparent;
    }
    #program .blok { touch-action: pan-y; }
    .b-ruce { background: var(--ruce); }
    .b-rizeni { background: var(--rizeni); }
    .b-rozhod { background: var(--rozhod); }
    .b-kapsa { background: var(--kapsa); }
    .b-pajka { background: var(--pajka); }
    .b-signal { background: var(--signal); }
    .legenda { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 10px; font: 700 12px/1 var(--mono); }
    .legenda[hidden] { display: none; }
    .lg-titul { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 10px; }
    .lg { display: inline-flex; align-items: center; gap: 3px; }
    .lg i { width: 12px; height: 16px; border: 1px solid var(--hard); display: inline-block; }
    .smycka.vetveni { background: var(--rozhod); }
    .smycka > .hlava { flex-wrap: wrap; row-gap: 4px; padding-top: 5px; padding-bottom: 5px; }
    .jinak-hlava { padding: 4px 10px 4px 32px; font: 800 12px/1.2 var(--mono); letter-spacing: .06em; cursor: pointer; }
    .jinak-hlava.vybrany { box-shadow: inset 4px 0 0 var(--hard); }
    ol.telo.bezi-vetev { box-shadow: inset 4px 0 0 var(--y); }
    .podminka-n { min-height: 30px; padding: 3px 8px; border: 1.5px solid var(--hard); background: var(--paper); font: 700 13px/1.15 Inter, ui-sans-serif, system-ui, sans-serif; text-align: left; cursor: pointer; max-width: 100%; }
    .podminka-n::after { content: " ▾"; font-size: 11px; }
    .volba-p { position: absolute; left: 30px; top: calc(100% - 2px); z-index: 10; display: grid; gap: 4px; padding: 6px; background: var(--paper); border: 1.5px solid var(--hard); box-shadow: 4px 4px 0 rgba(16,19,23,.2); min-width: 190px; }
    .volba-p button { min-height: 38px; padding: 0 10px; border: 1px solid var(--hard); background: var(--paper); font: 700 14px/1.2 Inter, ui-sans-serif, system-ui, sans-serif; text-align: left; cursor: pointer; }
    .volba-p button[aria-pressed="true"] { background: var(--y); }
    .blok .ikona { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .blok .nazev { flex: 1; }
    .blok .cislo { width: 18px; flex: none; font: 700 11px/1 var(--mono); color: var(--muted); }
    #paleta .blok { box-shadow: 2px 2px 0 rgba(16,19,23,.18); }
    #paleta .blok:active { transform: translate(1px, 1px); box-shadow: none; }
    .blok .smaz {
      display: none; width: 30px; height: 30px; margin-right: -6px; border: 1px solid var(--hard);
      background: var(--paper); font: 800 16px/1 var(--mono); cursor: pointer;
    }
    .blok.vybrany { box-shadow: inset 4px 0 0 var(--hard); }
    .blok.vybrany .smaz { display: grid; place-items: center; }
    .blok.aktivni { background: var(--y); box-shadow: 0 0 0 3px var(--hard); z-index: 1; }
    .blok.tazeny { opacity: .3; }
    .blok.podezrely { box-shadow: 0 0 0 3px var(--red); animation: ukaz 1s ease-in-out 3; }
    @keyframes ukaz { 50% { transform: translateX(6px); } }
    .vkladani { position: absolute; right: 8px; height: 0; border-top: 4px solid var(--y); outline: 1px solid var(--hard); z-index: 3; pointer-events: none; }
    .vkladani[hidden] { display: none; }
    #panel-program { position: relative; }
    ol.telo { list-style: none; margin: 0; padding: 5px 6px 5px 14px; display: grid; gap: 5px; min-height: 30px; background: var(--paper); border-top: 1.5px solid var(--hard); border-bottom: 1.5px solid var(--hard); margin-left: 12px; border-left: 1.5px solid var(--hard); }
    .smycka { list-style: none; border: 1.5px solid var(--hard); background: var(--rizeni); }
    .smycka > .hlava { border: 0; background: transparent; }
    .smycka > .hlava.vybrany { box-shadow: inset 4px 0 0 var(--hard); }
    .pata { height: 14px; cursor: pointer; }
    .pata.vybrany { box-shadow: inset 4px 0 0 var(--hard); background: repeating-linear-gradient(90deg, transparent 0 8px, rgba(16,19,23,.18) 8px 10px); }
    .prazdne-telo { padding: 6px 4px; color: var(--muted); font-size: 12px; border: 1px dashed var(--soft); list-style: none; }
    .smycka.bezi-smycka { box-shadow: 0 0 0 3px var(--y); }
    .smycka.tazeny { opacity: .3; }
    .kolo { font: 800 11px/1 var(--mono); color: var(--accent); }
    .pocet-n { min-width: 38px; height: 30px; border: 1.5px solid var(--hard); background: var(--paper); font: 800 14px/1 var(--mono); cursor: pointer; }
    .volba-n { position: absolute; left: 30px; top: calc(100% - 2px); z-index: 10; display: grid; grid-template-columns: repeat(5, 38px); gap: 4px; padding: 6px; background: var(--paper); border: 1.5px solid var(--hard); box-shadow: 4px 4px 0 rgba(16,19,23,.2); }
    .volba-n button { height: 38px; border: 1px solid var(--hard); background: var(--paper); font: 800 15px/1 var(--mono); cursor: pointer; }
    .volba-n button[aria-pressed="true"] { background: var(--y); }
    li.duch.smycka { padding: 0; }
    .duch {
      position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; list-style: none;
      box-shadow: 5px 6px 0 rgba(16,19,23,.25); transform-origin: 20% 50%; rotate: -2deg;
    }
    .duch.pryc { opacity: .55; outline: 2px dashed var(--red); }
    .duch .smaz { display: none; }
    body.tahne, body.tahne * { cursor: grabbing !important; }

    .vysledek {
      position: absolute; inset: 0; display: grid; place-items: center; padding: 8px;
      background: rgba(247,248,250,.6); z-index: 5;
    }
    .vysledek[hidden] { display: none; }
    .karta {
      width: min(380px, 100%); padding: 16px 18px; border: 2px solid var(--hard); background: var(--paper);
      box-shadow: 6px 6px 0 rgba(16,19,23,.2); animation: vyskoc .35s cubic-bezier(.2, 1.4, .4, 1);
    }
    @keyframes vyskoc { from { transform: scale(.85); opacity: 0; } }
    .vy-stitek { font: 800 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
    .karta h2 { margin: 4px 0 10px; font-size: 26px; letter-spacing: -.03em; }
    .karta table { width: 100%; border-collapse: collapse; font: 600 13px/1.3 var(--mono); }
    .karta th { text-align: left; }
    .karta td, .karta th { padding: 5px 4px; border-top: 1px solid var(--soft); }
    .karta td:nth-child(2) { font-weight: 900; font-size: 16px; }
    .spl { color: #0b7a4f; } .nespl { color: var(--muted); }
    .vy-nej { margin: 10px 0 0; font: 700 12px/1.3 var(--mono); }
    .vy-reakce { margin: 10px 0 14px; font-style: italic; }
    .vy-tl { display: flex; gap: 8px; flex-wrap: wrap; }

    body.bezi #panel-program .blok:not(.aktivni) { opacity: .85; }
    #program .blok.s-volbou { z-index: 30; opacity: 1; }
    @media (max-width: 420px) {
      .blok { font-size: 14px; gap: 6px; padding: 0 8px; }
      .tl { padding: 0 9px; }
      .skupina .tl { padding: 0 8px; }
    }
  </style>
</head>
<body>
  <header class="hlavicka">
    <a class="znacka" href="/" aria-label="Zpět na maly.cz">MM</a>
    <span class="titul">Plošňák</span>
    <span class="verze">prototyp</span>
  </header>

  <main class="hra" id="hra">
    <section class="zadani" aria-labelledby="lv-nazev">
      <nav class="levely" id="levely" aria-label="Levely"></nav>
      <div class="stitek" id="lv-stitek"></div>
      <h1 id="lv-nazev"></h1>
      <p id="lv-text"></p>
      <p class="napoveda" id="lv-napoveda"></p>
      <div class="cile" id="lv-cile"></div>
      <div class="legenda" id="legenda" hidden aria-label="Barevný kód odporů"></div>
    </section>

    <section class="deska" aria-label="Deska">
      <canvas id="deska" role="img" aria-label="Deska plošných spojů s panáčkem"></canvas>
      <div class="vysledek" id="vysledek" hidden></div>
    </section>

    <section class="ovladani" aria-label="Ovládání">
      <div class="tlacitka">
        <button type="button" class="tl hlavni" id="spust">▶ Spusť</button>
        <button type="button" class="tl" id="krok" aria-label="Krok po kroku">Krok</button>
        <button type="button" class="tl" id="zastav" aria-label="Zastav a vrať na začátek">■ Zastav</button>
        <span class="skupina" id="rychlost" role="group" aria-label="Rychlost">
          <button type="button" class="tl" data-r="1">1×</button>
          <button type="button" class="tl" data-r="4">4×</button>
          <button type="button" class="tl" data-r="0" aria-label="Okamžitě">⚡</button>
        </span>
      </div>
      <div id="testy" role="group" aria-label="Zkušební zadání" hidden></div>
      <div class="stav" id="stav" role="status" aria-live="polite"></div>
    </section>

    <section class="panel" id="panel-program" aria-label="Program">
      <div class="panel-hlava">Program <span id="pocet"></span> <button type="button" class="tl" id="vymaz">Smazat</button></div>
      <div class="zalozky" id="zalozky" role="group" aria-label="Čí program" hidden></div>
      <ol id="program"></ol>
    </section>

    <section class="panel panel-paleta" aria-label="Bloky">
      <div class="panel-hlava">Bloky</div>
      <div id="paleta"></div>
    </section>
  </main>

  <script src="sim.js"></script>
  <script src="levely.js"></script>
  <script src="hra.js"></script>
</body>
</html>
